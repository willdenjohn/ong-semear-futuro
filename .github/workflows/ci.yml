name: CI

# Roda em todo pull request para develop ou main: nenhum código entra sem testes e build passando
on:
  pull_request:
    branches: [develop, main]

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Auditoria de acessibilidade (axe-core)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx --yes http-server . -p 5500 -s &
          npx --yes wait-on http://127.0.0.1:5500/html/app.html
          npm run test:a11y
